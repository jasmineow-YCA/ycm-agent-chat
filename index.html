<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YCM Agent Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: full-height app shell; header and input dock pinned, conversation scrolls between; content column caps at 640px on wide screens. */
:root{
  --bg:#0A0A0C; --bar:#0F0F12; --surface:#17171B; --surface2:#222228; --chip:#26262C; --line:#2C2C33; --line2:#34343C;
  --fg:#F5F5F7; --fg2:#D4D4D8; --muted:#A1A1AA; --dim:#8B8B94;
  --accent:#8B5CF6; --accent-fg:#B794FF; --accent-soft:rgba(139,92,246,0.15); --accent-off:#2E2547; --accent-off-fg:#8D7FBF;
  --coin:#FFB020; --coin-ink:#3A2A0E; --tag:#5B21B6; --tag-fg:#EDE4FF;
  --grad:linear-gradient(135deg,#FF6FD8 0%,#A855F7 55%,#5B4BE0 100%);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
img{max-width:100%}
.scroll-x{overflow-x:auto;scrollbar-width:none}.scroll-x::-webkit-scrollbar{display:none}
#app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{width:100%;max-width:640px;margin:0 auto}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* explore */
.ex{flex:1;min-height:0;overflow-y:auto}
.ex img{display:block;width:100%;max-width:480px;margin:0 auto}
.nav{flex:none;height:76px;background:var(--bar);border-top:1px solid #1F1F25;display:flex;align-items:center;justify-content:center}
.nav .col{display:flex;align-items:center;justify-content:space-around;max-width:420px}
.navb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-width:64px;min-height:44px;justify-content:center;color:var(--dim)}
.navb.on{color:var(--fg)}
.fab{width:60px;height:60px;border-radius:30px;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 20px rgba(168,85,247,.45)}

/* header */
.hdr{flex:none;height:52px;display:flex;align-items:center}
.hdr .col{display:flex;align-items:center;gap:6px}
.hb{width:40px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.htitle{flex:1;text-align:center;font-weight:700;font-size:16px;padding-left:44px}
.coin{height:28px;padding:0 9px 0 4px;border-radius:14px;background:var(--chip);display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.coin i{width:20px;height:20px;border-radius:10px;background:var(--coin);color:var(--coin-ink);font:800 11px var(--font);font-style:normal;display:flex;align-items:center;justify-content:center}

/* stream */
.stream{flex:1;min-height:0;overflow-y:auto;padding-block:8px 20px}
.stream .col{display:flex;flex-direction:column;gap:18px}
.ah{display:flex;align-items:center;gap:6px}
.av{width:20px;height:20px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none}
.an{font-weight:700;font-size:13.5px;color:var(--accent-fg)}
.am{display:flex;flex-direction:column;gap:8px;min-width:0}
.at{color:#E4E4E7;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;max-width:min(80%,420px);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bubble{background:#2A2A31;border-radius:18px;padding:9px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.u-photo{width:96px;height:120px;border-radius:12px;object-fit:cover}
.songchip{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:6px 12px 6px 6px}
.songchip img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.songchip b{display:block;font-size:13px}.songchip small{font-size:11.5px;color:var(--muted)}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing span{width:7px;height:7px;border-radius:4px;background:var(--muted);animation:dot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.prog{display:flex;align-items:center;gap:10px;color:var(--fg2)}
.spin{width:16px;height:16px;border-radius:8px;border:2.5px solid #3F3F46;border-top-color:var(--accent-fg);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.typing span,.spin{animation:none}}
.skills{display:flex;gap:10px;padding-bottom:4px}
.sk{flex:none;width:128px;padding:0;border-radius:14px;background:var(--surface);overflow:hidden;position:relative;border:1px solid var(--line);text-align:left}
.sk.on{border:2px solid var(--accent)}
.sk img{width:100%;height:168px;object-fit:cover;display:block}
.sk span{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(180deg,rgba(10,10,12,0) 0%,rgba(10,10,12,.92) 55%);display:flex;flex-direction:column;gap:2px}
.sk b{font-size:13px;line-height:1.25}.sk small{font-size:11px;color:var(--fg2)}
.lyrics{background:var(--surface);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;color:#E4E4E7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:320px}
.grid div{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.grid div.upd{box-shadow:inset 0 0 0 2px var(--accent-fg)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid small{position:absolute;left:5px;bottom:4px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.pimgs{display:flex;gap:8px;flex-wrap:wrap}
.pimgs div{position:relative;width:96px;height:120px;border-radius:10px;overflow:hidden}
.pimgs img{width:100%;height:100%;object-fit:cover;display:block}
.pimgs small{position:absolute;left:5px;bottom:5px;font-size:10.5px;padding:1px 7px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff}
.pbox{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-width:420px}
.ptop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ptop small{display:block;font-size:11px;color:var(--muted)}.ptop b{font-size:13.5px}
.prow{display:flex;gap:12px;font-size:13.5px;border-top:1px solid var(--chip);padding-top:8px}
.prow span:first-child{width:84px;flex:none;color:var(--muted)}
.cmp{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;gap:12px;max-width:420px}
.cmp img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.cmp small{font-size:11px;color:var(--muted)}.cmp s{color:var(--dim)}
.oneimg{width:150px;height:240px;border-radius:12px;object-fit:cover}
.song{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;max-width:340px}
.song .row{display:flex;gap:12px;align-items:center}
.song img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.song b{display:block;font-size:15px}.song small{font-size:12px;color:var(--muted)}
.play{width:44px;height:44px;border-radius:22px;border:0;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;margin-left:auto}
.bar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar div{flex:1;height:4px;border-radius:2px;background:var(--line2);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent-fg)}
.mv{position:relative;border-radius:14px;overflow:hidden;max-width:100%}
.mv img{width:100%;height:100%;object-fit:cover;display:block}
.mv .ai{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
.mv .dl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:22px;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.mv .dur{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-variant-numeric:tabular-nums}
.ready{display:flex;gap:8px;flex-wrap:wrap}
.ready button{height:36px;padding:0 16px;border-radius:18px;font-weight:600;font-size:13.5px}
.ready .y{border:0;background:var(--accent);color:#fff}
.ready .n{border:1px solid #5B3F99;background:#1A1426;color:#D4BBFF}
.icons{display:flex;gap:2px;color:var(--dim);margin-left:-8px}
.icons button{width:34px;height:34px;border:0;background:none;color:inherit;display:flex;align-items:center;justify-content:center}
.ke{display:flex;flex-direction:column;gap:8px}
.ke>span{font-size:13px;font-weight:600;color:var(--fg2)}
.chips{display:flex;gap:8px}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--chip);color:#E4E4E7;font-size:13px;white-space:nowrap}

/* question sheet */
.sheet{flex:none;max-height:min(440px,58%);display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.45);padding-block:6px max(16px,env(safe-area-inset-bottom,0px))}
.sheet .col{display:flex;flex-direction:column;min-height:0;flex:1}
.handle{align-self:center;width:64px;height:22px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.handle span{width:36px;height:4px;border-radius:2px;background:#3F3F46}
.sq{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.sq b{flex:1;font-size:15.5px}.sq small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.opt{display:flex;align-items:center;gap:12px;padding:9px 10px;border:0;border-bottom:1px solid var(--chip);background:transparent;text-align:left;min-height:52px;border-radius:0}
.opt.sel{background:var(--accent-soft);border-radius:10px}
.num{width:24px;height:24px;flex:none;border-radius:6px;background:var(--chip);color:var(--fg2);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.chk{width:24px;height:24px;flex:none;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.opt img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
.ot{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.ol{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;flex-wrap:wrap}
.ol em{font-style:normal;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:8px;background:var(--tag);color:var(--tag-fg)}
.os{font-size:12.5px;color:var(--muted)}
.free{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 12px;height:46px;border-radius:10px;background:var(--surface2);border:1px solid transparent;flex:none}
.free.on{background:var(--accent-soft);border-color:var(--accent)}
.free input{flex:1;min-width:0;height:42px;border:0;background:transparent;color:var(--fg);font:16px var(--font);outline:none}
.free input::placeholder{color:var(--dim)}
.snext{display:flex;justify-content:flex-end;padding-top:12px;flex:none}
.next{height:40px;padding:0 16px 0 20px;border-radius:20px;border:0;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;background:var(--accent-off);color:var(--accent-off-fg)}
.next.on{background:var(--accent);color:#fff}

/* input dock */
.dock{flex:none;padding-block:6px max(14px,env(safe-area-inset-bottom,0px))}
.dock .col{display:flex;flex-direction:column;gap:8px}
.qpill{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-align:left}
.qpill span{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.skt{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:15px;background:var(--accent-soft);border:1px solid var(--accent);color:#E2D1FF;font-size:12.5px;font-weight:600}
.x{width:22px;height:22px;border-radius:11px;border:0;background:#5B3F99;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.slot{height:30px;padding:0 12px;border-radius:15px;border:1px dashed #71717A;background:transparent;color:var(--fg2);font-size:12.5px}
.att{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:10px;padding:4px 6px 4px 4px;font-size:12px}
.att img{width:28px;height:28px;border-radius:6px;object-fit:cover}
.att .x{background:var(--line2)}
.att span{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibar{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px}
.plus{width:36px;height:36px;flex:none;border-radius:18px;border:0;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center}
#msg{flex:1;min-width:0;resize:none;background:transparent;border:0;outline:none;color:var(--fg);padding:7px 2px;font:16px/1.45 var(--font);min-height:36px;max-height:170px;overflow-y:auto}
#msg::placeholder{color:var(--dim)}
.ic{width:36px;height:36px;flex:none;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ic.send{color:var(--fg2)}

/* attach menu */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.ov>button{flex:1;background:transparent;border:0}
.menu{background:var(--surface);border-radius:20px 20px 0 0;padding-block:10px max(26px,env(safe-area-inset-bottom,0px))}
.menu .col{display:flex;flex-direction:column;gap:4px}
.menu .grab{width:36px;height:4px;border-radius:2px;background:#3F3F46;align-self:center;margin-bottom:10px}
.mi{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border:0;background:transparent;text-align:left}
.mi i{width:40px;height:40px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:#D4BBFF}
.mi b{display:block}.mi small{font-size:12.5px;color:var(--muted)}
</style>

</head>

  set({ sheet:null });

/* ---------------- send / routing ---------------- */
function route(text,song){
  var mv = /\bmv\b|music video|video/i.test(text);
  if (mv && !song && /song/i.test(text) && !/my song/i.test(text)) return 'M4';
  if (mv || song) return 'M3';
  if (/\[(verse|chorus)/i.test(text) || text.split('\n').length >= 4) return 'M2';
  return 'M1';
}
function send(override){
  var s = S; var text = (override != null ? override : s.input).trim();
  if (s.sheet && override == null){ if(!text) return; set({ input:'' }); return sheetAdvance({ free:text }); }
  var song = override != null ? null : s.song, photo = override != null ? null : s.photo, sk = override != null ? null : s.skill;
  if (!text && !song && !photo) return;
  user(text, photo, song);
  if (override == null) set({ input:'', song:null, photo:null, skill:null });
  if (stage === 'mv'){
    if (/title/i.test(text)) return editTitle();
    if (/cover/i.test(text)) return editTarget('cover');
    if (/scene|close-up|rain/i.test(text)) return editTarget('scene');
  }
  if (stage === 'ready') return say([{ text:'Updated the plan. Ready when you are.', ready:lastReady }]);
  if (stage === 'songdone'){
    if (/mv with this song/i.test(text)){ flow = { kind:'M3', song:flow.lastSong, photo:null }; return startMV(); }
    if (/another version/i.test(text)){ flow.regen = true; return startSong("Let's try another version. Pick a new style."); }
    if (/1 min/i.test(text)){ flow.len = '1 min'; return songPlan(); }
  }
  var kind = sk ? (sk.songMode === 'ai' ? 'M4' : 'M3') : route(text, song);
  flow = { kind:kind, song:song, photo:photo, sub:sk };
  if (kind === 'M1') startSong("Here's what I have in mind for your song. Pick what feels right.");
  else if (kind === 'M2') startSong("Got your lyrics. Pick a style and I'll compose the song.");
  else startMV();
}

    ask([STEP.planOk], function(a){
      if (a[0].free){ if (/subtitle/i.test(a[0].free)) f.noSub = true; return mvPlan('Updated the plan:'); }
      ready('Great! Ready to generate? This uses 200 credits.', 'Generate Now', 200, function(){ genMV("Done! Here's your MV", 'Creating your MV…', '~2 minutes'); });
    });
  });
}
function genMV(title,label,eta){
  var f = flow;
  progress(label, eta, function(){
    mvV += 1; stage = 'mv';
    push({ r:'a', text:title, mv:{ v:mvV, ar:f.ar, dur:f.trim==='Chorus only'?'00:34':f.song.dur }, text2:"This looks polished! There's plenty more you can create.", icons:'result', explore:['Make Scene 2 a close-up in the rain','Recreate the cover','Change the title'] });
  }, 2600);
}
function editTarget(kind){
  var scene = kind === 'scene';
  say([{ text:scene ? "Here's the change for Scene 2:" : "Here's the new cover idea:", compare:scene ? { img:IMG.scene2, before:SCENE2_OLD, after:SCENE2_NEW } : { img:IMG.cover, before:'A captivating cover for "Down the Memory Lane".', after:'Golden-hour cover: the singer by a tall window, title in a soft serif.' } }], function(){
    ready(scene ? 'Recreate Scene 2? This uses 20 credits.' : 'Recreate the cover? This uses 10 credits.', 'Recreate Now', scene ? 20 : 10, function(){
      progress(scene ? 'Recreating Scene 2…' : 'Recreating the cover…', '~30 seconds', function(){
        say([{ text:scene ? 'Scene 2 is updated.' : 'The cover is updated.', img:scene ? IMG.frame : IMG.cover }], askMerge);
      }, 1800);
    });
  });
}
function editTitle(){
  say([{ text:'Sure. Pick a new title or write your own.' }], function(){
    ask([STEP.title], function(a){
      var t = a[0].label || a[0].free;
      say([{ text:"Here's the change:", plan:{ top:[{k:'Title',v:t},{k:'Author',v:'StarryNights'},{k:'Subtitle',v:'On'},{k:'Ratio',v:flow.ar}], rows:[] } }], askMerge);
    });
  });
}
function askMerge(){ ready('Merge it into your MV? This uses 20 credits.', 'Merge Now', 20, function(){ genMV("Done! Here's your updated MV", 'Merging your MV…', '~1 minute'); }); }

/* ---------------- render ---------------- */
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function agentHead(){ return '<div class="ah"><span class="av">'+SVG.note+'</span><span class="an">AI Agent</span></div>'; }
function iconsHTML(kind){
  if (kind === 'basic') return '<div class="icons"><button type="button" aria-label="Copy">'+SVG.copy+'</button><button type="button" aria-label="Good response">'+SVG.good+'</button><button type="button" aria-label="Bad response">'+SVG.bad+'</button></div>';
  if (kind === 'result') return '<div class="icons"><button type="button" aria-label="Download">'+SVG.dl+'</button><button type="button" aria-label="Regenerate">'+SVG.regen+'</button><button type="button" aria-label="Good result">'+SVG.good+'</button><button type="button" aria-label="Bad result">'+SVG.bad+'</button></div>';
  return '';
}
function msgHTML(m, hasUser){
  if (m.r === 'u'){
    var h = '<div class="u">';
    if (m.photo) h += '<img class="u-photo" src="'+m.photo+'" alt="Your photo">';
    if (m.song) h += '<div class="songchip"><img src="'+m.song.cover+'" alt=""><span><b>'+esc(m.song.title)+'</b><small>'+esc(m.song.dur+' · '+m.song.src)+'</small></span></div>';
    if (m.text) h += '<div class="bubble">'+esc(m.text)+'</div>';
    return h+'</div>';
  }
  if (m.r === 't') return '<div class="am">'+agentHead()+'<div class="typing" aria-label="AI Agent is typing"><span></span><span></span><span></span></div></div>';
  var h = '<div class="am">'+agentHead();
  if (m.progress) h += '<div class="prog"><span class="spin" aria-hidden="true"></span><span>'+esc(m.progress.label)+' <span style="color:var(--muted)">Estimated time '+esc(m.progress.eta)+'</span></span></div>';
  if (m.text) h += '<div class="at">'+esc(m.text)+'</div>';
  if (m.welcome && !hasUser){
    h += '<div class="skills scroll-x" id="skills">'+SKILLS.map(function(t,i){
      var on = S.skill && S.skill.name === t.name;
      return '<button type="button" class="sk'+(on?' on':'')+'" data-act="skill" data-i="'+i+'"><img src="'+t.img+'" alt=""><span><b>'+esc(t.name)+'</b><small>'+esc(t.meta)+'</small></span></button>';
    }).join('')+'</div>';
  }
  if (m.lyrics) h += '<div class="lyrics">'+esc(m.lyrics)+'</div>';
  if (m.grid) h += '<div class="grid">'+m.grid.map(function(g,i){ var lab = i===0 ? 'Cover' : 'Scene '+i; return '<div'+(i===m.gridUpdated?' class="upd"':'')+'><img src="'+g+'" alt="'+lab+'"><small>'+lab+'</small></div>'; }).join('')+'</div>';
  if (m.plan){
    if (m.plan.imgs && m.plan.imgs.length) h += '<div class="pimgs">'+m.plan.imgs.map(function(p){ return '<div><img src="'+p.img+'" alt=""><small>'+esc(p.tag)+'</small></div>'; }).join('')+'</div>';
    h += '<div class="pbox"><div class="ptop">'+m.plan.top.map(function(t){ return '<div><small>'+esc(t.k)+'</small><b>'+esc(t.v)+'</b></div>'; }).join('')+'</div>'+m.plan.rows.map(function(r){ return '<div class="prow"><span>'+esc(r.k)+'</span><span>'+esc(r.v)+'</span></div>'; }).join('')+'</div>';
  }
  if (m.compare) h += '<div class="cmp"><img src="'+m.compare.img+'" alt=""><div style="display:flex;flex-direction:column;gap:4px;font-size:13.5px;min-width:0"><small>Before</small><s>'+esc(m.compare.before)+'</s><small style="margin-top:4px">After</small><span>'+esc(m.compare.after)+'</span></div></div>';
  if (m.img) h += '<img class="oneimg" src="'+m.img+'" alt="Updated result">';
  if (m.song){
    var playing = S.playing === m.id;
    h += '<div class="song"><div class="row"><img src="'+m.song.cover+'" alt="Song cover"><div style="min-width:0"><b>'+esc(m.song.title)+'</b><small>'+esc(m.song.meta||'')+'</small></div><button type="button" class="play" data-act="play" data-id="'+m.id+'" aria-label="'+(playing?'Pause':'Play')+'">'+(playing?SVG.pauseI:SVG.playI)+'</button></div><div class="bar"><span>'+(playing?'0:35':'0:00')+'</span><div><i style="width:'+(playing?'28%':'0')+'"></i></div><span>'+esc(m.song.dur)+'</span></div></div>';
  }
  if (m.mv){
    var box = m.mv.ar === '16:9' ? 'width:320px;aspect-ratio:16/9' : 'width:210px;aspect-ratio:9/16';
    h += '<div class="mv" style="'+box+'"><img src="'+IMG.mv+'" alt="Your MV"><span class="ai">AI</span><span class="dl" aria-hidden="true">'+SVG.dlw+'</span><span class="dur">'+esc(m.mv.dur)+'</span></div>';
  }
  if (m.text2) h += '<div class="at">'+esc(m.text2)+'</div>';
  if (m.ready && !m.readyDone) h += '<div class="ready"><button type="button" class="y" data-act="yes" data-id="'+m.id+'">'+esc(m.ready.label)+'</button><button type="button" class="n" data-act="no" data-id="'+m.id+'">Not Yet</button></div>';
  h += iconsHTML(m.icons);
  if (m.explore) h += '<div class="ke"><span>Keep exploring</span><div class="chips scroll-x">'+m.explore.map(function(c){ return '<button type="button" data-act="chip" data-c="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+'</div></div>';
  return h+'</div>';
}
function sheetHTML(){
  var sh = S.sheet, st = sh.steps[sh.step], many = st.opts.length > 1, can = sh.sel >= 0 || !!sh.free.trim();
  var h = '<div class="sheet gut"><div class="col"><button type="button" class="handle" data-act="collapse" aria-label="Collapse question"><span></span></button>';
  h += '<div class="sq"><b>'+esc(st.q)+'</b>'+(sh.steps.length>1?'<small>'+(sh.step+1)+' of '+sh.steps.length+'</small>':'')+'</div><div class="opts">';
  st.opts.forEach(function(o,i){
    var sel = sh.sel === i;
    h += '<button type="button" class="opt'+(sel?' sel':'')+'" data-act="pick" data-i="'+i+'">';
    if (sel) h += '<span class="chk">'+SVG.check+'</span>'; else if (many) h += '<span class="num">'+(i+1)+'</span>';
    if (o.img) h += '<img src="'+o.img+'" alt="" style="'+(o.imgSt||'')+'">';
    h += '<span class="ot"><span class="ol">'+esc(o.label)+(o.tag?'<em>'+esc(o.tag)+'</em>':'')+'</span>'+(o.sub?'<span class="os">'+esc(o.sub)+'</span>':'')+'</span></button>';
  });
  if (st.free !== false) h += '<label class="free'+(sh.free.trim()?' on':'')+'">'+SVG.pencil+'<input id="free" type="text" autocomplete="off" aria-label="Write your own answer" placeholder="'+esc(st.ph||'Something else...')+'" value="'+esc(sh.free)+'"></label>';
  h += '</div><div class="snext"><button type="button" class="next'+(can?' on':'')+'" data-act="next">Next '+SVG.next+'</button></div></div></div>';
  return h;
}
function dockHTML(){
  var h = '<div class="dock gut"><div class="col">';
  if (S.sheet && S.sheet.collapsed){ var st = S.sheet.steps[S.sheet.step]; h += '<button type="button" class="qpill" data-act="expand"><span>'+esc(st.q)+'</span>'+SVG.up+'</button>'; }
  if (S.skill){
    var slots = S.skill.needs.filter(function(n){ return n === 'song' ? !S.song : !S.photo; });
    h += '<div class="tags"><span class="skt">@'+esc(S.skill.name)+'<button type="button" class="x" data-act="clearSkill" aria-label="Remove skill">×</button></span>'+slots.map(function(n){ return '<button type="button" class="slot" data-act="openAttach">+ '+(n==='song'?'Song':(S.skill.photos===2?'Photos of you two':'Photo'))+'</button>'; }).join('')+'</div>';
  }
  if (S.song || S.photo){
    h += '<div class="tags">';
    if (S.photo) h += '<span class="att"><img src="'+S.photo+'" alt="Attached photo"><span>Photo</span><button type="button" class="x" data-act="rmPhoto" aria-label="Remove photo">×</button></span>';
    if (S.song) h += '<span class="att"><img src="'+S.song.cover+'" alt=""><span>'+esc(S.song.title)+'</span><button type="button" class="x" data-act="rmSong" aria-label="Remove song">×</button></span>';
    h += '</div>';
  }
  h += '<div class="ibar"><button type="button" class="plus" data-act="openAttach" aria-label="Add photo or song">'+SVG.plus+'</button><textarea id="msg" rows="1" aria-label="Message" placeholder="Type your message here ...">'+esc(S.input)+'</textarea><button type="button" class="ic" aria-label="Voice input">'+SVG.mic+'</button><button type="button" class="ic send" data-act="send" aria-label="Send">'+SVG.send+'</button></div>';
  return h+'</div></div>';
}
function chatHTML(){
  var welcome = { id:0, r:'a', welcome:true, text:"Hi! I'm your AI Agent. Tell me your idea and I'll write the song, make the MV, or both. Pick a skill to get started." };
  var hasUser = S.msgs.some(function(m){ return m.r === 'u'; });
  var h = '<div class="screen"><header class="hdr gut"><div class="col"><button type="button" class="hb" data-act="goExplore" aria-label="Back">'+SVG.back+'</button><div class="htitle">Muse Agent</div><div class="coin"><i>C</i>'+S.credits+'</div><button type="button" class="hb" data-act="newChat" aria-label="New chat">'+SVG.menu+'</button></div></header>';
  h += '<div class="stream gut" id="stream"><div class="col">'+[welcome].concat(S.msgs).map(function(m){ return msgHTML(m, hasUser); }).join('')+'</div></div>';
  h += (S.sheet && !S.sheet.collapsed) ? sheetHTML() : dockHTML();
  h += '</div>';
  if (S.attach) h += '<div class="ov"><button type="button" data-act="closeAttach" aria-label="Close"></button><div class="menu gut"><div class="col"><span class="grab"></span>'+ATTACH.map(function(a,i){ return '<button type="button" class="mi" data-act="attach" data-i="'+i+'"><i>'+icon(a.d)+'</i><span><b>'+a.label+'</b><small>'+a.sub+'</small></span></button>'; }).join('')+'</div></div></div>';
  return h;
}
function exploreHTML(){
  return '<div class="screen"><div class="ex"><img src="'+IMG.explore+'" alt="YouCam Muse Explore"></div><nav class="nav gut"><div class="col"><button type="button" class="navb on">'+SVG.explore+'Explore</button><button type="button" class="fab" data-act="goChat" aria-label="Open AI Agent">'+SVG.chat+'</button><button type="button" class="navb">'+SVG.history+'History</button></div></nav></div>';
}
function autosize(ta){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 170)+'px'; }
var app = document.getElementById('app');
function render(){
  var ae = document.activeElement, fid = ae && ae.id, s0 = ae && ae.selectionStart, s1 = ae && ae.selectionEnd;
  var st = document.getElementById('stream'), prevTop = st ? st.scrollTop : null;
  var sk = document.getElementById('skills'), prevLeft = sk ? sk.scrollLeft : 0;
  app.innerHTML = S.screen === 'explore' ? exploreHTML() : chatHTML();
  var ta = document.getElementById('msg'); if (ta) autosize(ta);
  var sk2 = document.getElementById('skills'); if (sk2) sk2.scrollLeft = prevLeft;
  if (fid){ var el = document.getElementById(fid); if (el){ el.focus({ preventScroll:true }); try { el.setSelectionRange(s0, s1); } catch(e){} } }
  var s2 = document.getElementById('stream');
  if (s2){
    var key = S.msgs.length+'|'+(S.sheet ? S.sheet.step+':'+S.sheet.collapsed+':'+S.sheet.steps.length : '-');
    if (key !== lastKey || prevTop == null){ s2.scrollTop = s2.scrollHeight; lastKey = key; }
    else s2.scrollTop = prevTop;
  }
}
var ACT = {
  goChat:function(){ set({ screen:'chat' }); },
  goExplore:function(){ set({ screen:'explore' }); },
  newChat:newChat,
  skill:function(d){ var t = SKILLS[+d.i]; set({ skill:t, input:'Use @'+t.name+' '+t.prompt }); },
  clearSkill:function(){ set({ skill:null, input:'' }); },
  rmPhoto:function(){ set({ photo:null }); },
  rmSong:function(){ set({ song:null }); },
  openAttach:function(){ set({ attach:true }); },
  closeAttach:function(){ set({ attach:false }); },
  attach:function(d){ set(Object.assign({ attach:false }, ATTACH[+d.i].apply())); },
  pick:function(d){ set(function(s){ return { sheet:Object.assign({}, s.sheet, { sel:+d.i, free:'' }) }; }); },
  next:sheetNext,
  collapse:function(){ set(function(s){ return { sheet:Object.assign({}, s.sheet, { collapsed:true }) }; }); },
  expand:function(){ set(function(s){ return { sheet:Object.assign({}, s.sheet, { collapsed:false }) }; }); },
  send:function(){ send(); },
  yes:function(d){ var m = S.msgs.find(function(x){ return x.id === +d.id; }); if (m) onReady(m, true); },
  no:function(d){ var m = S.msgs.find(function(x){ return x.id === +d.id; }); if (m) onReady(m, false); },
  chip:function(d){ if (!S.sheet) send(d.c); },
  play:function(d){ set({ playing:S.playing === +d.id ? null : +d.id }); }
};
app.addEventListener('click', function(e){ var t = e.target.closest('[data-act]'); if (!t) return; var f = ACT[t.dataset.act]; if (f) f(t.dataset); });
app.addEventListener('input', function(e){
  if (e.target.id === 'msg'){ S.input = e.target.value; autosize(e.target); }
  else if (e.target.id === 'free'){ var v = e.target.value; set(function(s){ return { sheet:Object.assign({}, s.sheet, { free:v, sel:v ? -1 : s.sheet.sel }) }; }); }
});
app.addEventListener('keydown', function(e){
  if (e.isComposing) return;
  if (e.target.id === 'msg' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  else if (e.target.id === 'free' && e.key === 'Enter'){ e.preventDefault(); sheetNext(); }
});
render();
</script>

</body>
</html>
